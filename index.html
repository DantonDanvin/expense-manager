<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kharcha — Expense Manager</title>
  <meta name="description" content="A fast, private expense manager that keeps your data in your own Google Drive.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6d5dfc">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236d5dfc'/%3E%3Cpath d='M20 44V20h8l8 14 8-14h8v24h-7V31l-9 15-9-15v13z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">₹</span>
        <span class="brand-text">Kharcha<small>a modern ledger</small></span>
      </a>
      <nav class="nav" id="side-nav">
        <a href="#/dashboard" data-route="dashboard"><span class="nav-idx">01</span><span>Overview</span></a>
        <a href="#/transactions" data-route="transactions"><span class="nav-idx">02</span><span>Ledger</span></a>
        <a href="#/budgets" data-route="budgets"><span class="nav-idx">03</span><span>Budgets</span></a>
        <a href="#/settings" data-route="settings"><span class="nav-idx">04</span><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="sync-pill" id="sync-pill" type="button" title="Google Drive sync status">
          <span class="sync-dot"></span><span class="sync-text">Not connected</span>
        </button>
        <div class="user-chip" id="user-chip" hidden></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-right">
          <div class="month-nav" id="month-nav">
            <button class="btn-icon" data-action="month-prev" title="Previous month" type="button"><i data-icon="chevron-left"></i></button>
            <button class="month-label" data-action="month-today" title="Jump to current month" type="button" id="month-label">Month</button>
            <button class="btn-icon" data-action="month-next" title="Next month" type="button"><i data-icon="chevron-right"></i></button>
          </div>
          <button class="btn btn-ghost btn-theme" data-action="toggle-theme" title="Toggle theme" type="button"><i data-icon="moon"></i></button>
          <button class="btn btn-primary" data-action="new-tx" type="button"><i data-icon="plus"></i><span>Add</span><kbd>N</kbd></button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav class="bottomnav" id="bottom-nav">
      <a href="#/dashboard" data-route="dashboard"><i data-icon="home"></i><span>Overview</span></a>
      <a href="#/transactions" data-route="transactions"><i data-icon="list"></i><span>Ledger</span></a>
      <button class="fab" data-action="new-tx" type="button" aria-label="Add transaction"><i data-icon="plus"></i></button>
      <a href="#/budgets" data-route="budgets"><i data-icon="target"></i><span>Budgets</span></a>
      <a href="#/settings" data-route="settings"><i data-icon="settings"></i><span>Settings</span></a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
